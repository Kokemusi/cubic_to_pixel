<html>
    <link rel = "stylesheet" href = "style.css" type = "text/css"></link>
    <script type = "importmap">
        {
            "imports":{
                "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.webgpu.js",
                "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.webgpu.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/",
                "key_stats":"./modules/key_stats.js",
                "ThreeHandler":"./modules/ThreeHandler.js",
                "MapMesh":"./modules/mapMeshHandler.js",
                "Preview":"./modules/preview.js"
            }
        }
    </script>
    <script src = "main.js" type = "module"></script>
    <div id = "div_container">
        <div id = "div_container_header">
            <div id = "div_container_file">
                    <select id = "select_file">
                        <option value = "default" selected>ファイル</option>
                        <option value = "load">プロジェクトの読み込み</option>
                        <option value = "save-all">プロジェクトの保存</option>
                        <option value = "save-part">編集中の部品を保存</option>
                        <option value = "export-all">スプライトの出力(texture packer形式)</option>
                    </select>
                    <input type = text id = "input_file_name" value = "new_project"/>
                    <div id = "div_container_file_controller">
                        <input type = "file" id = "load_project" accept=".c2d" />
                    </div>
            </div>
            <div id = "div_input_color">
                <input type = "color" id = "input_pen_color" value = #FFFFFF title = "色選択"/>
            </div>
            <div id = "div_container_tools">
                <div id = "div_container_pen">
                    <input type = "radio" name = "pen_type" id = "radio_block" value ="block" class = "radio" checked /><label for = "radio_block" selected class = "radio_button" title = "ブロック設置"><img src = "images/block.png" class = "pen_button"></label>
                    <input type = "radio" name = "pen_type" id = "radio_temp" value ="temp" class = "radio" /><label for = "radio_temp" selected class = "radio_button" title  = "仮ブロック設置"><img src = "images/temp.png" class = "pen_button"></label>
                    <input type = "radio" name = "pen_type" id = "radio_brush" value ="brush" class = "radio" /><label for = "radio_brush" class = "radio_button" title = "ブラシ"><img src = "images/brush.png" class = "pen_button"></label>
                    <input type = "radio" name = "pen_type" id = "radio_brush_six" value ="brush_six" class = "radio" /><label for = "radio_brush_six" class = "radio_button" title = "ブラシ(全面)"><img src = "images/brush_six.png" class = "pen_button"></label>
                    <input type = "radio" name = "pen_type" id = "radio_fill" value ="fill" class = "radio" /><label for = "radio_fill" class = "radio_button" title = "直方体"><img src = "images/fill.png" class = "pen_button"></label>
                    <input type = "radio" name = "pen_type" id = "radio_eraser" value ="eraser" class = "radio" /><label for = "radio_eraser" class = "radio_button" title="ブロック削除(安全版)"><img src = "images/eraser.png" class = "pen_button"></label>
                    <input type = "radio" name = "pen_type" id = "radio_beam_eraser" value ="beam" class = "radio" /><label for = "radio_beam_eraser" class = "radio_button" title="ブロック削除"><img src = "images/beam.png" class = "pen_button"></label>
                    <input type = "radio" name = "pen_type" id = "radio_sampler" value ="sampler" class = "radio" /><label for = "radio_sampler" class = "radio_button" title="スポイト"><img src = "images/sampler.png" class = "pen_button"></label>
                    <input type = "radio" name = "pen_type" id = "radio_anchor" value ="anchor" class = "radio" /><label for = "radio_anchor" class = "radio_button" title="視点中心選択"><img src = "images/anchor.png" class = "pen_button"></label>
                </div>
            </div>
            <div id = "div_button_toggle_edge">
                <button type = button id = "button_toggle_edge">縁取切替</button>
            </div>
        </div>
        <div id = "div_container_main">
            <div id = "div_container_editor">
                <div id = "div_text_position">
                    ここに座標を表示
                </div>
                <div id = "div_canvas_axis">
                    <canvas id = "canvas_axis"></canvas>
                </div>
                <div id = "div_canvas_main">
                    <canvas id = "canvas_main"></canvas>
                </div>
            </div>
            <div id = "div_container_parts">
                <fieldset>
                    <div id = "div_text_parts">
                        パーツ　　
                    </div>
                    <div id = "div_container_radio_parts">ここにパーツの選択ボタンを表示</div>
                    <div id = "div_button_add_parts">
                        <button type = button id = "button_add_parts">+</button>
                    </div>
                </fieldset>
            </div>
            <div id = "div_container_preview">
                <fieldset>
                    <div id = "div_container_preview_header">
                        プレビュー
                        <div id = "div_container_button_export">
                            <button type = "button" id = "button_toggleShadow">影切替</button>
                            <button type = "button" id = "button_toggleOverlap">重複部切替</button>
                        </div>
                        
                    </div>
                    <div id = "div_canvas_preview">
                        <canvas id = "canvas_preview"></canvas>
                    </div>
                </fieldset>
            </div>
        </div>
    </div>
</html>
